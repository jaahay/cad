name: CAD validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install workspace dependencies
        run: uv sync
      - name: Run geometry tests
        run: uv run pytest
      - name: Generate tactile-dice exports
        run: uv run python tools/export_project.py tactile-dice
      - name: Validate tactile-dice meshes
        run: uv run python tools/validate_mesh.py build/tactile-dice/stl
      - name: Generate rotary-vault exports
        run: uv run python tools/export_project.py rotary-vault
      - name: Validate rotary-vault meshes
        run: uv run python tools/validate_mesh.py build/rotary-vault/stl
