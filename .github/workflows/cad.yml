name: CAD validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install workspace dependencies
        run: uv sync
      - name: Run geometry tests
        run: uv run pytest
      - name: Generate all CAD exports
        run: uv run python tools/export_project.py --all
      - name: Validate all generated meshes
        run: uv run python tools/validate_mesh.py build
