name: CAD validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  tactile-dice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/tactile-dice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/tactile-dice/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate CAD exports
        run: python src/dice_family.py
      - name: Validate STL meshes
        run: python src/repair_validate_stl.py
