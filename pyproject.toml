[project]
name = "cad-workspace"
version = "0.1.0"
description = "Source-controlled parametric CAD projects and repository tooling."
requires-python = ">=3.12,<3.14"
dependencies = [
  "cadquery==2.8.0",
  "trimesh==4.11.1",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["projects"]
addopts = ["--import-mode=importlib"]
